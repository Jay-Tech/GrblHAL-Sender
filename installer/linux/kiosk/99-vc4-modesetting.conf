# Raspberry Pi 5, bare Xorg with no desktop environment: pin the KMS path.
#
# With no xorg.conf at all, X enumerates every video driver installed on the
# system. On a Pi OS Lite image that means modesetting and fbdev. modesetting
# does the right thing unaided - the log shows it finding the display at
# /dev/dri/card1 by itself - but fbdev is probed too, cannot resolve a busID on
# a KMS-only machine, and fails fatally:
#
#     (WW) Falling back to old probe method for fbdev
#     (II) FBDEV(0): using default device
#     (EE) Cannot run in framebuffer mode. Please specify busIDs
#          for all framebuffer devices
#     (EE) Server terminated with error (1).
#
# One driver's failure ends the whole server, so the session lasts about 150 ms.
# startx exits, the login shell it replaced is gone, agetty respawns, and five
# rounds later systemd hits the restart limit and stops trying. What the
# operator sees is a black screen with a blinking caret, no login prompt, and
# nothing on it to say why - the console that would have shown the error is the
# same console the loop destroyed.
#
# Matching on the vc4 kernel driver rather than naming a card: DRM card
# numbering follows probe order and is not a stable thing to hardcode. On this
# machine the display is card1 and card0 is the V3D render node, but that is an
# observation, not a guarantee.
#
# Purging xserver-xorg-video-fbdev fixes it too, and more bluntly. This is here
# as well because a later apt run can pull the driver back in, and the failure
# it causes is expensive to diagnose a second time.

Section "OutputClass"
    Identifier  "vc4"
    MatchDriver "vc4"
    Driver      "modesetting"
EndSection
