<text x="46.0" y="614.0" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">Three things that make this section click</text>
<text x="46.0" y="636.0" font-size="12" fill="#334155" text-anchor="start" font-weight="normal" font-family="ui-sans-serif, system-ui, sans-serif">1.  Place in current order — J1, F1, Q9 — so the chain is a straight line you can follow with a finger.</text>
<text x="46.0" y="654.0" font-size="12" fill="#334155" text-anchor="start" font-weight="normal" font-family="ui-sans-serif, system-ui, sans-serif">2.  Q9 is drain-to-input, source-to-output: the opposite way round to the eight channel MOSFETs. R6 and D9 are its satellites, keep them beside it.</text>
<text x="46.0" y="672.0" font-size="12" fill="#334155" text-anchor="start" font-weight="normal" font-family="ui-sans-serif, system-ui, sans-serif">3.  TVS1, C1, C2 are not in the chain. They hang off V+ down to the ground pour — three vias, no traces.</text>
</svg>