name: Release Build

on:
  push:
    tags:
      - 'v*'
  # Manual runs, for building a branch without cutting a release. Pick the branch in the
  # "Run workflow" dropdown; the installers arrive as run artifacts and the release job is
  # skipped. Note GitHub only offers the button once this trigger exists on the default
  # branch — a workflow_dispatch that lives only on a feature branch is never listed.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version stamped into the build. Defaults to Directory.Build.props plus -dev.<run number>.'
        required: false
        default: ''

permissions:
  contents: write

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Skip NuGet certificate revocation lookups during restore. Linux runners
  # enforce CRL checks strictly and fail (NU3012) when a package's signing
  # certificate is reported revoked by the issuer — currently affecting
  # ReactiveUI / Splat. Signatures are still validated; only revocation
  # lookup is downgraded to "offline" (treat as unknown).
  NUGET_CERT_REVOCATION_MODE: offline
  PROJECT_PATH: GrbLHALSender.Desktop/GrbLHALSender.Desktop.csproj

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              # No tag to read on a manual run, so fall back to the props file and mark the
              # build as a one-off so it is never mistaken for a released version.
              PROPS_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)
              VERSION="${PROPS_VERSION}-dev.${{ github.run_number }}"
            fi
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The published binaries take their version from the tag (-p:Version, below), so
      # this check is not about them. Directory.Build.props is what a local build reports
      # and what the in-app update check compares against the latest release tag — if it
      # drifts behind, a freshly built app announces an update it already has. Fail here
      # rather than ship a release the props file disagrees with.
      - name: Verify Directory.Build.props matches the tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          # Prerelease tags (v1.1.0-beta) carry a suffix the props file does not, and the
          # app strips it too, so compare the numeric part only.
          TAG_CORE="${TAG_VERSION%%-*}"
          PROPS_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)
          echo "tag:   $TAG_VERSION (comparing $TAG_CORE)"
          echo "props: $PROPS_VERSION"
          if [ -z "$PROPS_VERSION" ]; then
            echo "::error::No <Version> found in Directory.Build.props."
            exit 1
          fi
          if [ "$TAG_CORE" != "$PROPS_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match <Version>$PROPS_VERSION</Version> in Directory.Build.props. Set the props file to $TAG_CORE, commit, then move the tag."
            exit 1
          fi

  build-windows:
    needs: prepare
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            arch: x64
          - rid: win-arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:Version=${{ needs.prepare.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ needs.prepare.outputs.version }} `
            /DArch=${{ matrix.arch }} `
            /DPublishDir=..\..\publish\${{ matrix.rid }} `
            installer\windows\GrblHALSender.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.rid }}
          path: artifacts/*.exe

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            deb_arch: amd64
          - rid: linux-arm64
            deb_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Clean and Restore
        run: |
          dotnet clean ${{ env.PROJECT_PATH }} -c Release
          dotnet restore ${{ env.PROJECT_PATH }} -r ${{ matrix.rid }}

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:Version=${{ needs.prepare.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Verify native libraries
        run: |
          echo "libSkiaSharp.so:"
          ls -la publish/${{ matrix.rid }}/libSkiaSharp.so || echo "NOT FOUND"
          echo "libHarfBuzzSharp.so:"
          ls -la publish/${{ matrix.rid }}/libHarfBuzzSharp.so || echo "NOT FOUND"

      - name: Build .deb package
        run: |
          chmod +x installer/linux/build-deb.sh
          ./installer/linux/build-deb.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ matrix.deb_arch }}" \
            "publish/${{ matrix.rid }}"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.rid }}
          path: artifacts/*.deb

  build-macos:
    needs: prepare
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - rid: osx-x64
            arch: x64
          - rid: osx-arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:Version=${{ needs.prepare.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build .dmg
        run: |
          chmod +x installer/macos/build-dmg.sh
          ./installer/macos/build-dmg.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ matrix.arch }}" \
            "publish/${{ matrix.rid }}"

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}
          path: artifacts/*.dmg

  release:
    needs: [prepare, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    # Tag pushes only. A manual run is for testing a branch, so it stops at the uploaded
    # artifacts rather than publishing a public release from unreleased code.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "GrblHAL Sender ${{ needs.prepare.outputs.version }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          files: |
            release-assets/**/*
